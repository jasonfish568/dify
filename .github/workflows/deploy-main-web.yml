name: Build deployment web 7aa0c1e89009
on:
  push:
    branches: [codex/deploy-main-web-7aa0c1e89009]
    paths: [.github/workflows/deploy-main-web.yml]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7aa0c1e89009de2da9986c6bbaa1ae294b904c7a
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
