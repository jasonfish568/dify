          tags: jasonfish568/dify-web:main-7aa0c1e89009
          build-args: COMMIT_SHA=7aa0c1e89009de2da9986c6bbaa1ae294b904c7a
          labels: |
            org.opencontainers.image.revision=7aa0c1e89009de2da9986c6bbaa1ae294b904c7a
            org.opencontainers.image.source=https://github.com/jasonfish568/dify
          outputs: type=docker,dest=/tmp/dify-web.tar
