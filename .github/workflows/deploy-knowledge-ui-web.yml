name: Build fork knowledge UI web
on:
  push:
    branches: [codex/build-knowledge-ui-413d6beaea20]
    paths: [.github/workflows/deploy-knowledge-ui-web.yml]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 413d6beaea20863320209a442230934d36d07982
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64
          tags: jasonfish568/dify-web:main-413d6beaea20
          build-args: COMMIT_SHA=413d6beaea20863320209a442230934d36d07982
          labels: |
            org.opencontainers.image.revision=413d6beaea20863320209a442230934d36d07982
            org.opencontainers.image.source=https://github.com/jasonfish568/dify
          outputs: type=docker,dest=/tmp/dify-web.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dify-web-main-413d6beaea20
          path: /tmp/dify-web.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: error
