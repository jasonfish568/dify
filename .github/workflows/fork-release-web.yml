name: Build fork release web (amd64)

on:
  workflow_dispatch:
  push:
    branches:
      - codex/upgrade-dify-118
    paths:
      - .github/workflows/fork-release-web.yml

permissions:
  contents: read

concurrency:
  group: fork-release-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'jasonfish568/dify'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build native amd64 release image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64
          push: false
          tags: jasonfish568/dify-web:1.18.0-jasonfish.1
          build-args: COMMIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=1.18.0-jasonfish.1
          outputs: type=docker,dest=/tmp/dify-web.tar
      - name: Compress release image
        run: gzip -1 /tmp/dify-web.tar
      - name: Retain release image for deployment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dify-web-amd64-${{ github.sha }}
          path: /tmp/dify-web.tar.gz
          compression-level: 0
          retention-days: 1
